name: nndl-pj2-ljh
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - matplotlib
  - tqdm
  - pip
  - pip:
      # CUDA 12.8 wheels are required for RTX 5090 / sm_120 support.
      - --index-url https://download.pytorch.org/whl/cu128
      - torch==2.10.0
      - torchvision==0.25.0
